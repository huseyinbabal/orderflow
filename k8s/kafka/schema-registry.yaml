# Confluent Schema Registry — the contract gatekeeper for the "orders" topic.
# Stores schemas in the Kafka topic `_schemas`; no extra database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-schema-registry
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: cp-schema-registry }
  template:
    metadata:
      labels: { app: cp-schema-registry }
    spec:
      containers:
        - name: cp-schema-registry
          image: confluentinc/cp-schema-registry:8.0.0
          ports:
            - containerPort: 8081
          env:
            - { name: SCHEMA_REGISTRY_HOST_NAME, value: "cp-schema-registry" }
            - { name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "kafka:9092" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cp-schema-registry
  namespace: default
spec:
  selector: { app: cp-schema-registry }
  ports:
    - port: 8081
      targetPort: 8081
