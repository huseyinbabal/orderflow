# Monitoring on its own pool: kafka-exporter (consumer-group lag / topic offsets)
# + a single-pod Prometheus with the remote-write receiver on (k6 writes here).
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka-exporter, namespace: default }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-exporter } }
  template:
    metadata: { labels: { app: kafka-exporter } }
    spec:
      nodeSelector: { workload: monitoring }
      tolerations: [{ key: workload, operator: Equal, value: monitoring, effect: NoSchedule }]
      containers:
        - name: exporter
          image: danielqsj/kafka-exporter:v1.8.0
          args: ["--kafka.server=kafka:9092", "--web.listen-address=:9308"]
          ports: [{ containerPort: 9308, name: metrics }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka-exporter, namespace: default }
spec: { selector: { app: kafka-exporter }, ports: [{ port: 9308, targetPort: 9308 }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: default }
data:
  prometheus.yml: |
    global: { scrape_interval: 10s, evaluation_interval: 10s }
    scrape_configs:
      - job_name: kafka-exporter
        static_configs: [{ targets: ["kafka-exporter:9308"] }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: default }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      nodeSelector: { workload: monitoring }
      tolerations: [{ key: workload, operator: Equal, value: monitoring, effect: NoSchedule }]
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-remote-write-receiver"
            - "--storage.tsdb.retention.time=6h"
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 2Gi } }
      volumes:
        - { name: cfg, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: default }
spec: { selector: { app: prometheus }, ports: [{ port: 9090, targetPort: 9090 }] }
