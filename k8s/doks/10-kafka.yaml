# 3-broker Kafka (KRaft, combined broker+controller) on the dedicated `kafka` pool.
# RF=3, min.insync=2, 12 default partitions. One broker per node (podAntiAffinity).
---
apiVersion: v1
kind: Service
metadata: { name: kafka-headless, namespace: default }
spec:
  clusterIP: None
  selector: { app: kafka }
  publishNotReadyAddresses: true
  ports:
    - { name: plaintext, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: default }
spec:
  selector: { app: kafka }
  ports:
    - { name: plaintext, port: 9092, targetPort: 9092 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: default }
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      nodeSelector: { workload: kafka }
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      tolerations:
        - { key: workload, operator: Equal, value: kafka, effect: NoSchedule }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: kafka } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              ORD=${HOSTNAME##*-}
              export KAFKA_NODE_ID=$ORD
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.default.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          env:
            - { name: CLUSTER_ID, value: "kJf9mLpQ7RtY2wXz3AbCdE" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "0@kafka-0.kafka-headless.default.svc.cluster.local:9093,1@kafka-1.kafka-headless.default.svc.cluster.local:9093,2@kafka-2.kafka-headless.default.svc.cluster.local:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2" }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "2" }
            - { name: KAFKA_NUM_PARTITIONS, value: "48" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "2" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data/logs" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms2g -Xmx3g" }
            - { name: KAFKA_NUM_NETWORK_THREADS, value: "6" }
            - { name: KAFKA_NUM_IO_THREADS, value: "8" }
          ports:
            - { containerPort: 9092, name: plaintext }
            - { containerPort: 9093, name: controller }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          resources:
            requests: { cpu: "1", memory: 3.5Gi }
            limits: { cpu: "3", memory: 6Gi }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        resources: { requests: { storage: 50Gi } }
