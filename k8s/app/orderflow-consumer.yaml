# The Kafka consumer deployment — SAME image as the API, different role.
# Rabbit listeners are off; only the Kafka consumer groups (fulfillment, analytics) run.
# Scale it up and down live during the k6 demo:
#   kubectl scale deploy/orderflow-consumer --replicas=3
# Parallelism still caps at min(partitions, pods) — the Session 1 wall, now visible in Grafana.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-consumer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: orderflow-consumer }
  template:
    metadata:
      labels: { app: orderflow-consumer }
    spec:
      containers:
        - name: orderflow-consumer
          image: orderflow:latest
          imagePullPolicy: Never        # image is side-loaded via `kind load`
          env:
            - { name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - { name: SCHEMA_REGISTRY_URL, value: "http://cp-schema-registry:8081" }
            - { name: ORDERFLOW_LISTENERS_RABBIT, value: "false" }
            - { name: SPRING_RABBITMQ_HOST, value: "rabbitmq" }
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: rabbitmq-default-user, key: username }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: rabbitmq-default-user, key: password }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
