# The consumer deployment — SAME image as the API, different role.
# Rabbit listeners are off. What runs here: the Kafka groups (fulfillment, analytics)
# AND the Session 4 feed consumer group + PEL sweeper (ORDERFLOW_LISTENERS_REDIS=true).
# Scale it up and down live during the demos:
#   kubectl scale deploy/orderflow-consumer --replicas=3
# Kafka parallelism caps at min(partitions, pods); the feed group splits the same way,
# and the sweeper's distributed lock means only ONE of those pods sweeps per tick.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-consumer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: orderflow-consumer }
  template:
    metadata:
      labels: { app: orderflow-consumer }
    spec:
      containers:
        - name: orderflow-consumer
          image: orderflow:latest
          imagePullPolicy: Never        # image is side-loaded via `kind load`
          env:
            - { name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - { name: SCHEMA_REGISTRY_URL, value: "http://cp-schema-registry:8081" }
            - { name: ORDERFLOW_LISTENERS_RABBIT, value: "false" }
            - { name: ORDERFLOW_LISTENERS_REDIS, value: "true" }    # feed consumer group + sweeper
            - { name: ORDERFLOW_LISTENERS_CDC, value: "true" }      # Adım 0: Debezium outbox.event.Order listener
            - { name: SPRING_DATA_REDIS_HOST, value: "redis" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://orderflow-db-rw:5432/orderflow" }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: orderflow-db-app, key: username }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: orderflow-db-app, key: password }
            - { name: SPRING_RABBITMQ_HOST, value: "rabbitmq" }
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: rabbitmq-default-user, key: username }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: rabbitmq-default-user, key: password }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
