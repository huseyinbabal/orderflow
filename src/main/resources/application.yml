# Which listener sets run in THIS process. Locally both are on (one JVM does it all);
# in Kubernetes the API deployment turns Kafka off and the consumer deployment turns
# Rabbit off — that's what lets consumers scale as their own pods.
orderflow:
  listeners:
    rabbit: true
    kafka: true
    redis: true                   # feed consumer group + PEL sweeper (API pods set this false)
  feed:
    maxlen: 100000                # approximate MAXLEN on the "feed" stream — memory cap
    sweeper:
      interval-ms: 15000          # how often a pod tries to sweep the PEL
      idle-ms: 60000              # an entry idle this long is considered abandoned → claim it

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  rabbitmq:
    listener:
      simple:
        prefetch: 10                 # slow external providers → keep it low
        retry:
          enabled: true              # in-process retry with backoff (no requeue storm)
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
    publisher-confirm-type: correlated   # never publish blind
    publisher-returns: true              # catch unroutable messages
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true       # typed OrderEvent, not GenericRecord
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
