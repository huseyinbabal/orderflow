services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest/guest)

  kafka:
    image: apache/kafka:4.0.0   # KRaft — no ZooKeeper
    ports:
      - "9092:9092"
    # Two listeners: HOST (localhost:9092, for the app + CLI on your machine) and
    # PLAINTEXT (kafka:19092, for other containers — the schema registry needs it).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.0
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
    depends_on: [kafka]

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  # --- CDC + Outbox vs Event Sourcing (Adım 0) — compose fallback for the kind path ---
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]   # Debezium needs logical decoding
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    ports:
      - "5434:5432"          # 5434 on the host — 5432 is often already taken
    networks:
      default:
        # same hostname the Debezium connector uses on kind (CNPG's -rw service),
        # so debezium/outbox-connector.json is identical in both environments
        aliases: [orderflow-db-rw]

  connect:
    image: debezium/connect:3.0.0.Final                 # Kafka Connect + Debezium bundled
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: orderflow-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on: [kafka, postgres]
